<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masha Cantik - Linktree</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
   
  <!-- File CSS Terpisah -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="phone-frame">
    <div class="content">
      
      <div class="profile">
        <img src="foto masha.jpeg" alt="Masha Cantik" class="avatar">
        <h1 class="name">Masha Cantik</h1>
        <p class="bio">Media Social Masha</p>
      </div>

      <div class="links">
        <a href="https://www.tiktok.com/@mashaandthebear_official?is_from_webapp=1&sender_device=pc" class="btn-link">
          <i class="fa-brands fa-tiktok icon"></i>
          <span>Tiktok</span>
        </a>

        <a href="https://www.instagram.com/mashaandthebear/" class="btn-link">
          <i class="fa-brands fa-instagram icon icon-ig"></i>
          <span>Instagram</span>
        </a>
        
        <a href="https://open.spotify.com/track/1VMsQbmk2RxxPzRToLDJjf?si=0e88edd4d54d4ac2" class="btn-link">
          <i class="fa-brands fa-spotify icon icon-spotify"></i>
          <span>Spotify</span>
        </a>

        <a href="https://www.youtube.com/MashaBearEN" class="btn-link">
          <i class="fa-brands fa-youtube icon icon-yt"></i>
          <span>Youtube</span>
        </a>

        <a href="https://www.facebook.com/MashaAndTheBear/" class="btn-link">
          <i class="fa-brands fa-facebook icon icon-fb"></i>
          <span>Facebook</span>
        </a>
      </div>

    </div>
  </div>
  <script src="script.js"> </script>
  
   

  

</body>
</html>
